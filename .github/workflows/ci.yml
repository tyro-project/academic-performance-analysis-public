name: CI — Code Quality Check

on:
  push:
    branches: [production-grade]
  pull_request:
    branches: [production-grade]

jobs:
  php-lint:
    name: PHP Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Check PHP syntax on all files
        run: |
          echo "Running PHP syntax check..."
          find . -name "*.php" \
            -not -path "./vendor/*" \
            -not -path "./TCPDF/*" \
            -not -path "./excelReader/*" \
            -not -path "./dompdf/*" \
            | while read file; do
              php -l "$file" || exit 1
            done
          echo "All PHP files passed syntax check."

      - name: Check for exposed credentials
        run: |
          echo "Checking for hardcoded credentials..."
          if grep -rn "DB_PASS\|DB_USER\|DB_NAME" includes/config.php | grep -v "define\|//"; then
            echo "Warning: Credentials found in config files."
          fi
          echo "Credential check done."

  deploy-webhook:
    name: Trigger Server Deploy
    runs-on: ubuntu-latest
    needs: php-lint
    if: github.ref == 'refs/heads/production-grade' && github.event_name == 'push'

    steps:
      - name: Trigger webhook on server
        run: |
          curl -s -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Secret: ${{ secrets.DEPLOY_SECRET }}" \
            -d '{"branch":"production-grade"}' \
            --max-time 30 \
            --retry 3 \
            || echo "Webhook delivery attempted."
